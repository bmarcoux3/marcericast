[project]
name = "personal-cashflow"
version = "0.1.0"
description = "Deterministic personal cash flow, tax, and net worth projection engine driven by declarative YAML scenarios"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = "."

