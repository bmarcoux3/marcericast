version: "1.0"

meta:
  scenario_name: "30+ Year Comprehensive 115-Event Family Life Plan"
  start_year: 2026
  end_year: 2056
  tax_status: "MFJ"

macroeconomics:
  general_inflation_rate: 0.025
  growth_rates:
    equities: 0.07
    bonds: 0.035
    real_estate: 0.03

tax_rules:
  inflate_brackets: true
  reference_year: 2026
  inflation_ref: "general_inflation_rate"
  federal:
    standard_deduction: 32200
    brackets:
      - limit: 24800
        rate: 0.10
      - limit: 100800
        rate: 0.12
      - limit: 211400
        rate: 0.22
      - limit: 403550
        rate: 0.24
      - limit: 512450
        rate: 0.32
      - limit: 768700
        rate: 0.35
      - limit: .inf
        rate: 0.37

accounts:
  - id: "checking_primary"
    name: "Primary Checking"
    type: "liquid"
    balance: 100000
    growth_rate_ref: "bonds"
    is_cash_reserve: true
    min_target_balance: 30000.0

  - id: "brokerage_vti"
    name: "Taxable Brokerage"
    type: "taxable_brokerage"
    balance: 500000.0
    growth_rate_ref: "equities"
    cost_basis: 350000.0

  - id: "college_529"
    name: "529 College Savings"
    type: "liquid"
    balance: 80000.0
    growth_rate_ref: "equities"

waterfall_strategy:
  surplus_allocation:
    - account_id: "college_529"
      max_annual_contribution: 15000.0
    - account_id: "brokerage_vti"

  deficit_drawdown_order:
    - account_id: "checking_primary"
    - account_id: "brokerage_vti"

