    category: "expense"
    start_year: 2026
    end_year: *retirement
    base_amount: 18000
    reference_year: 2026
    target_account_id: retirement_pretax
    inflation_ref: "general_inflation_rate"
    is_pre_tax_deduction: true
    tags: ["Investments"]

  - id: "retirement_contributions_roth"
